name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  mcp-manager:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    defaults:
      run:
        working-directory: mcp-manager
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: mcp-manager/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run test:all
