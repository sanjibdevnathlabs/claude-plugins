name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  mcp-manager:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    defaults:
      run:
        working-directory: mcp-manager
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: mcp-manager/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run test:all

  git-ci-build-status:
    name: git-ci-build-status
    runs-on: ubuntu-latest
    needs: [mcp-manager]
    if: always()
    steps:
      - name: Check CI results
        run: |
          if [ "${{ needs.mcp-manager.result }}" != "success" ]; then
            echo "CI failed: mcp-manager=${{ needs.mcp-manager.result }}"
            exit 1
          fi
          echo "All CI checks passed"
